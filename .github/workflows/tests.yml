name: Tests

# Run the full pytest suite on every PR and on main. No GPU on the runners, so
# the HFT harness exercises its pandas/NumPy fallback (same as a CPU dev box).
#
# `push` is scoped to main deliberately. Unscoped, a push to a branch with an
# open PR fires this workflow twice — once for `push`, once for `pull_request` —
# and each firing is 4 jobs (3 Python versions + lint). Branch pushes are covered
# by the `pull_request` event; this keeps post-merge validation on main.
on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref. Without this, pushing three fixes to
# a PR in quick succession leaves the first two matrices running to completion on
# code nobody will merge.
#
# Cancellation is limited to pull requests on purpose. Each push to main is a
# distinct commit that may be released or bisected against, so its run is allowed
# to finish even when the next merge lands moments later; a superseded PR run has
# no such value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev + bench extras)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,bench]"

      - name: Run pytest
        run: pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.12.11

      - name: Run ruff
        run: ruff check .
