# zai-org/GLM-5.2-FP8 — the vendor's recommended deployment shape.
# Source: https://huggingface.co/zai-org/GLM-5.2-FP8/blob/main/config.json
#         https://huggingface.co/zai-org/GLM-5.2/blob/main/config.json
# Read from config.json and model.safetensors.index.json only — no traces.
#
# Identical architecture to `glm-5.2`; the difference is precision, and precision
# is the difference between a model that fits one 8xH200 node and one that does
# not. 753.33 GB on disk against the bf16 release's 1.507 TB.

name: zai-org/GLM-5.2-FP8
family: glm_moe_dsa
description: >
  GLM-5.2 quantised to FP8 e4m3 with 128x128 weight blocks — 78 layers, hidden
  6144, 256 routed experts top-8, MLA + DeepSeek Sparse Attention with
  IndexShare (21 of 78 layers compute the index). The backbone GEMMs, the dense
  FFN, the shared expert and all routed experts are fp8; lm_head, embed_tokens,
  the MTP eh_proj and the lightning indexer stay bf16; the router is fp32. This
  is the entry to plan against — the vendor recommends it and it is what fits
  8xH200.

spec:
  hidden: 6144
  n_layers: 78
  vocab: 154880

  # MLA attention. head_dim (192) is the nope width; q_head_dim widens to
  # 192+64=256, and v_head_dim (256) differs from it — score and value reads use
  # different per-head widths. num_key_value_heads is 64 in the config but is a
  # red herring: the cache holds one kv_lora_rank latent per token, shared across
  # all 64 query heads, so KV traffic derives from kv_lora_rank, never 64*head_dim.
  n_heads: 64
  q_lora_rank: 2048
  kv_lora_rank: 512
  qk_nope_head_dim: 192
  qk_rope_head_dim: 64
  v_head_dim: 256

  # DeepSeek Sparse Attention indexer. index_topk_freq 4 is the IndexShare period:
  # one 'full' layer computes the top-2048 selection, the next three reuse it.
  index_n_heads: 32
  index_head_dim: 128
  index_topk: 2048
  index_topk_freq: 4
  # Read verbatim from the checkpoint (period-4 past the 3-layer 'full' prefix).
  # The 'shared' layers physically carry no indexer weights — proven, not fitted.
  indexer_types:
    - full
    - full
    - full
    - shared
    - shared
    - shared
    - full
