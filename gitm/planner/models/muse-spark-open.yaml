# Meta Muse-Spark-Open-816B-A42B — MuseSparkForConditionalGeneration
# (model_type muse_spark, text_config muse_spark_text): GQA sliding-window /
# full-attention MoE with a LATENT expert bank, plus vision and audio towers.
#
# SOURCES — read this before trusting any number below.
#   The canonical repo meta-models/Muse-Spark-Open-816B-A42B is GATED (HTTP 401
#   without a token), as is its -NVFP4 sibling. ITS config.json WAS NOT READ.
#   Every fact here comes from ungated mirrors:
#   * unsloth/Muse-Spark-Open-816B-A42B @ 49cade7b0c6ed297f0434229ac67eea5f9ae1220
#     config.json, model.safetensors.index.json (total_size 1,644,333,137,920),
#     and the safetensors headers of ALL 65 shards (HTTP Range reads). The
#     header byte sum equals total_size exactly, and every tensor is BF16
#     except the router (gate.weight, gate.e_score_correction_bias), which is
#     F32. So this mirror carries the original-precision weights, not a requant.
#   * mlx-community/Muse-Spark-Open-816B-A42B-4bit config.json — its
#     text_config is identical key-for-key to unsloth's; the only differences
#     are mlx's added quantization block and a top-level eos list.
#   Two independent mirrors agreeing is strong evidence the canonical config
#   says the same, but it is not a read of it.
#
# Family note: `hybrid` is the closest fit and carries the attention, window
# schedule and expert bank. It cannot express the latent MoE: each layer
# projects 8192 -> 4096 (pre_expert_proj), runs the experts entirely in the
# 4096 space, and projects back 4096 -> 8192 (post_expert_proj). HybridMoE
# experts read and write `hidden`. See the moe_intermediate_size comment for
# the fold that keeps the expert bank byte- and FLOP-exact, and `unmodelled`
# for what the projections themselves cost.

name: meta-models/Muse-Spark-Open-816B-A42B
family: hybrid
description: >
  62 layers, hidden 8192, GQA 128 query / 16 KV heads at head_dim 64 with a
  q-width sigmoid output gate. 46 sliding-window (W=2048) and 16 full-attention
  layers (1, 5, ..., 61); the full layers carry rope_theta 0 (NoPE). Every
  layer is MoE: 256 experts top-8, no shared expert, experts run in a 4096-wide
  latent space between per-layer 8192<->4096 projections. BF16 weights, F32
  router. 1,644.33 GB on disk (unsloth mirror). 816.7B params excluding
  embedding/lm_head (the "816B"), 42.8B active (the "A42B"). Vision (50-layer
  ViT, hidden 1536) and audio (4-stage conv) towers are out of scope for a
  text decode step.

spec:
  hidden: 8192
  n_layers: 62
  vocab: 202048

  # Attention. q_proj [8192, 8192] = 128 x 64; k_proj/v_proj [1024, 8192] =
  # 16 x 64. head_dim is NOT hidden/n_heads-derived by accident here — it
  # happens to equal 8192/128. No q_norm/k_norm tensors exist in the index.
  n_heads: 128
  num_kv_heads: 16
  head_dim: 64
  # self_attn.gate_proj [8192, 8192] is a q-width output gate on every layer.
  # config.json has no attn_output_gate key; this is read from the tensor.
  attn_output_gate: true
  # Sliding layers rotate the whole head at theta 5e5. Full layers have
  # layer_rope_theta 0, i.e. no rotation at all — the spec has one rotary
  # fraction for every layer, so RoPE is overcharged on 16 layers' elementwise
  # node (negligible; see unmodelled).
  partial_rotary_factor: 1.0

  # Same GQA geometry on both layer kinds — every k_proj/v_proj in the index
  # has the same shape, so no swa_* overrides.
  sliding_window: 2048
  swa_rope_theta: 500000.0
  swa_attention_sink: false         # no sink tensors in the index

  # Mixture of experts. num_local_experts 256, num_experts_per_tok 8,
  # num_shared_experts 0, mlp_layer_types all "sparse".
  num_experts: 256
  num_experts_per_tok: 8
  shared_expert_intermediate_size: 0
  # FOLDED, not transcribed. config.json says moe_intermediate_size 4096 AND
  # moe_hidden_size 4096. The headers settle what that means:
  #   experts.gate_up_proj [256, 8192, 4096]  -> 4096 latent in, 2x4096 out
  #   experts.down_proj    [256, 4096, 4096]  -> 4096 in, 4096 latent out
  #   mlp.pre_expert_proj  [4096, 8192]       -> hidden 8192 -> latent 4096
  #   mlp.post_expert_proj [8192, 4096]       -> latent 4096 -> hidden 8192
  # So one expert is 3 x 4096 x 4096 = 50,331,648 params. The spec prices an
  # expert as 3 x hidden x I, so I = 4096*4096/8192 = 2048 reproduces it
  # exactly: same weight bytes, same 2x-params FLOPs per routed position.
  # Writing the config's 4096 here would price every expert 2x — +1,598 GB,
  # nearly doubling the checkpoint. What the fold gets wrong is GEMM shape
  # (k=8192,n=2048 instead of k=4096,n=4096) and the activation term; see
  # unmodelled.
  moe_intermediate_size: 2048

  # Written out. Full attention sits at layer % 4 == 1, and 62 = 15 x 4 + 2,
  # so no {pattern, repeat} form tiles it ([S,F,S,S] x 15 leaves S,F over).
  layer_types: [
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention, sliding_attention, sliding_attention,
    sliding_attention, full_attention,
  ]
  # Dead: the schedule above is explicit.
  full_attention_interval: 4

  # No dense layers, no MTP tensors in the index.
  mtp_num_hidden_layers: 0

  all_reduces_per_layer: 2

  weight_dtype: bf16
  act_dtype: bf16
  kv_dtype: bf16                    # OPEN — serving decision
  op_dtype_overrides:
    - [moe_router, fp32]            # gate.weight is F32 [256, 8192] in the header

  # Unused (no linear-attention layers); present because the spec is shared
  # with the gated-DeltaNet members of the family.
  linear_num_value_heads: 1
  linear_value_head_dim: 1

provenance:
  verified:
    - claim: text_config read from two independent ungated mirrors, identical
      detail: >
        unsloth @ 49cade7b and mlx-community 4bit agree on every text_config
        key. The canonical gated repo was NOT read; name is the canonical id.
    - claim: the layer schedule
      detail: >
        layer_types puts full attention at 1, 5, 9, ..., 61 (16 layers) and
        sliding at the other 46. layer_rope_theta is 0 on exactly those 16
        indices and 5e5 elsewhere, so the global layers are NoPE.
    - claim: the expert bank is latent (MoE in a 4096 space)
      detail: >
        Header shapes gate_up_proj [256, 8192, 4096], down_proj [256, 4096,
        4096], pre_expert_proj [4096, 8192], post_expert_proj [8192, 4096],
        plus pre/post_expert_norm [4096]. Identical on all 62 layers.
    - claim: parameter count reconciles with the name
      detail: >
        From headers: experts 798.86B, attention 13.52B, latent projections
        4.16B, router 0.13B, norms/residual gates 3.1M, embed 1.66B, lm_head
        1.66B, vision+audio 2.05B; total 822.04B. Text minus embed/lm_head =
        816.68B ("816B"). Active per token excluding embed/lm_head = 8/256 of
        experts + attention + latent + router = 42.78B ("A42B").
    - claim: predicted weight bytes against the published checkpoint
      detail: >
        model_weight_bytes = 1,631.66 GB against unsloth's total_size of
        1,644.33 GB (-0.77%). The residual is fully itemised: latent
        projections 8.32 GB, vision tower + adapter + projection 3.86 GB, audio
        tower 0.24 GB, router stored F32 but counted at weight_dtype 0.26 GB
        (model_weight_bytes ignores op_dtype_overrides), norms and residual
        gates 6 MB. Expert bank (1,597.73 GB) and attention (27.04 GB) match
        the headers to the byte.
    - claim: KV rate
      detail: >
        16 full layers x 16 KV heads x (64+64) x 2 B = 65,536 B per token of
        context; 46 windowed layers hold a fixed 46 x 2048 x 2048 x 2 B =
        385.9 MB per sequence (bf16 cache).

  estimated:
    - field: moe_intermediate_size
      value: 2048
      detail: >
        A fold, not a config value (config: 4096). Exact in expert weight bytes
        and FLOPs; wrong in GEMM aspect ratio and in the moe_routed activation
        term, which assumes hidden-wide (8192) dispatch where the real kernel
        moves 4096-wide latents.
    - field: all_reduces_per_layer
      value: 2
      detail: TP convention (post-attention, post-FFN), not observed in a trace.

  open:
    - question: does the canonical (gated) config.json match the mirrors
      detail: Needs an HF token with access to meta-models/Muse-Spark-Open-816B-A42B.
    - question: KV cache dtype
      detail: bf16 per config dtype; fp8 halves both KV terms. Engine launch args.
    - question: how TP/EP shards the latent projections, and whether all-to-all runs at 4096
      detail: >
        If EP dispatch happens after pre_expert_proj, all-to-all bytes are half
        what a hidden-wide dispatch would move. No serving implementation was
        read.

  unmodelled:
    - Latent projections pre_expert_proj + post_expert_proj, 2 x 8192 x 4096
      per layer = 4.16B params, 8.32 GB (0.51% of checkpoint bytes). They are
      ALWAYS active, so at decode they matter far more than their share of the
      checkpoint. Per layer at batch 1 the modelled weight read is ~1.24 GB
      (8 experts 805 MB + attention 436 MB); the projections add 134 MB, so the
      prediction is ~9.8% light on weight traffic at bs=1, shrinking toward
      ~0.5% as the batch wakes all 256 experts. Same order on FLOPs per
      position (134M vs 1.24G). A shared expert of width 2731 would reproduce
      these bytes to 0.012%, but it would be a fabricated field emitting a
      mis-named node with the wrong sharding, so it is deliberately not used.
    - pre_expert_norm / post_expert_norm (RMSNorm on the 4096 latent) and the
      per-layer residual gates (post_attention_residual_gate,
      post_feedforward_residual_gate, residual_gate_temperature 0.3) — small
      elementwise ops with no node.
    - qk_scale_factor 5.473 (custom softmax scale), final_logit_softcapping 20,
      output_multiplier 0.1768, post_norm_eps — fused scalars, no cost.
    - NoPE on the 16 full-attention layers; the spec charges RoPE there anyway
      (elementwise node only).
    - Router e_score_correction_bias (aux-loss-free bias, 256 F32 per layer).
    - Vision tower (50 layers, hidden 1536, window/full schedule), vision
      adapter/projection, and audio tower (4-stage conv, out 8192). A text
      step never enters them; 4.1 GB on disk.
