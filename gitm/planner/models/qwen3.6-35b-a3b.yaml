# Qwen/Qwen3.6-35B-A3B — hybrid linear-attention MoE.
# Source: https://huggingface.co/Qwen/Qwen3.6-35B-A3B/blob/main/config.json

name: Qwen/Qwen3.6-35B-A3B
family: hybrid
description: >
  40 layers, 30 gated-DeltaNet and 10 full-attention, top-8 of 256 experts plus
  one shared expert. Multimodal wrapper (Qwen3_5MoeForConditionalGeneration);
  the vision tower is out of scope for a text decode step.

spec:
  hidden: 2048
  n_layers: 40
  vocab: 248320

  # Attention — head_dim is NOT hidden/n_heads on this checkpoint. 16 heads at
  # 256 against a 2048 hidden size means the query projection widens to 4096.
  n_heads: 16
  num_kv_heads: 2
  head_dim: 256
  partial_rotary_factor: 0.25
  attn_output_gate: true

  # Gated DeltaNet. The recurrent state is float32 while the model is bfloat16;
  # they are genuinely different and collapsing them halves the term that
  # dominates these layers at low batch.
  linear_num_key_heads: 16
  linear_num_value_heads: 32
  linear_key_head_dim: 128
  linear_value_head_dim: 128
  linear_conv_kernel_dim: 4
  ssm_state_dtype: fp32
  conv_dim: 4096

  # Mixture of experts. moe_intermediate_size 512 is the `N=512` in vLLM's
  # "Config file not found at .../E=256,N=512,device_name=NVIDIA_H200.json".
  num_experts: 256
  num_experts_per_tok: 8
  moe_intermediate_size: 512
  shared_expert_intermediate_size: 512

  # Layer schedule. Declared explicitly by the checkpoint, and the phase is
  # load-bearing: full attention falls on layers 3, 7 ... 39, so a modulo rule
  # guessed from the interval alone would place all ten in the wrong positions
  # while producing an entirely plausible total.
  layer_types:
    pattern: [linear_attention, linear_attention, linear_attention, full_attention]
    repeat: 10
  full_attention_interval: 4

  # Declared by the checkpoint, but vLLM builds the draft head only under a
  # speculative config. predict_hybrid_graph emits it only when asked.
  mtp_num_hidden_layers: 1

  weight_dtype: bf16
  kv_dtype: bf16
  act_dtype: bf16

provenance:
  # Checks that hold against evidence outside this repository.
  verified:
    - claim: page arithmetic reproduces the engine's own padding
      detail: >
        attention page at block 1056 = 2,162,688 B; linear-attention state page
        = 2,146,304 B; ratio 1.00763. vLLM logs "Setting attention block size to
        1056 tokens" and "Padding mamba page size by 0.76%" at startup.
    - claim: predicted weight bytes match the published checkpoint
      detail: 69.56 GB predicted against 66.97 GiB (71.9 GB) on disk, -3.3%.

  estimated:
    - field: conv_dim
      value: 4096
      detail: >
        Fitted, not read. The architectural reading is q+k+v channels (10,240).
        4,096 — the value width alone — is what closes the page arithmetic
        above: 4096 x (4-1) x 4 B = 49,152 B of convolution state, which with
        the 2,097,152 B recurrent state gives exactly the 0.76% pad the engine
        logs. Three significant figures of agreement from a single observation
        is strong evidence but it is still an inference. Verify against
        Qwen3_5MoeText in transformers before treating it as read. Nodes that
        depend on it carry `estimated`.

  unmodelled:
    - Prefill. Decode only, as with every other graph family. The chunked
      prefill path runs a different set of GDN kernels (chunk_*, solve_tril,
      recompute_w_u) with different asymptotics.
    - The vision tower (27 layers, hidden 1152). A text decode step never
      enters it.
