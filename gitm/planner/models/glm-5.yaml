# zai-org/GLM-5 — GlmMoeDsaForCausalLM (MLA + DeepSeek Sparse Attention + MoE).
# Source: https://huggingface.co/zai-org/GLM-5/blob/main/config.json
# Read from config.json, model.safetensors.index.json and the safetensors header
# of model-00274-of-00282 (MTP layer 78), plus the GLM-5-FP8 sibling's headers
# for shapes (model-00001/00081-of-00142) — no traces.
#
# Same shape as glm-5.2 in every width (hidden, MLA ranks, heads, experts,
# vocab), but a DIFFERENT architecture in the one place that matters at long
# context: there is no IndexShare. config.json carries no index_topk_freq and no
# indexer_types, and the weight map says why — every one of the 78 layers, plus
# the MTP layer, carries its own *.indexer.* tensors. So this is a standalone
# entry, not `extends: glm-5.2`: overriding the 78-entry schedule, the MTP
# sharing flag and the router dtype would leave nothing inherited worth the name.

name: zai-org/GLM-5
family: glm_moe_dsa
description: >
  78 layers, hidden 6144, 744B total / 40B active per token (vendor figures).
  MLA attention (kv_lora_rank 512, one latent shared across 64 query heads) with
  a DeepSeek Sparse Attention lightning indexer selecting top-2048 on EVERY
  layer — no IndexShare, unlike GLM-5.2. First 3 layers dense, remaining 75 MoE
  (256 experts, top-8, one shared). One MTP draft head, which carries its own
  indexer. bf16 throughout; zai-org/GLM-5-FP8 is the deployment shape.

spec:
  hidden: 6144
  n_layers: 78
  vocab: 154880

  # MLA attention. Identical to glm-5.2. config.json says head_dim 64 here (192
  # on GLM-5.2) — not a weight width: q_b_proj / kv_b_proj shapes in the header
  # ([16384, 2048] = 64 x (192+64); [28672, 512] = 64 x (192+256)) are the same
  # as GLM-5.2's, so head_dim is a rotary/label field the spec has no use for.
  # num_key_value_heads 64 is the usual MLA red herring.
  n_heads: 64
  q_lora_rank: 2048
  kv_lora_rank: 512
  qk_nope_head_dim: 192
  qk_rope_head_dim: 64
  v_head_dim: 256

  # DeepSeek Sparse Attention indexer, on every layer. The config declares no
  # index_topk_freq; 1 makes the frequency fallback agree with the explicit
  # schedule below. The schedule is read from the weight map: *.indexer.wq_b,
  # wk, weights_proj and k_norm exist on layers 0..77 (and on MTP layer 78) —
  # 79 indexer-bearing layers against GLM-5.2's 22.
  index_n_heads: 32
  index_head_dim: 128
  index_topk: 2048
  index_topk_freq: 1
  indexer_types: [
    full, full, full, full, full, full, full, full, full, full,
    full, full, full, full, full, full, full, full, full, full,
    full, full, full, full, full, full, full, full, full, full,
    full, full, full, full, full, full, full, full, full, full,
    full, full, full, full, full, full, full, full, full, full,
    full, full, full, full, full, full, full, full, full, full,
    full, full, full, full, full, full, full, full, full, full,
    full, full, full, full, full, full, full, full,
  ]

  # Mixture of experts. Same as glm-5.2. No mlp_layer_types in the config;
  # first_k_dense_replace 3 is what the weight map shows — experts.* on layers
  # 3..77 and the MTP layer, none on 0..2.
  n_routed_experts: 256
  n_shared_experts: 1
  num_experts_per_tok: 8
  moe_intermediate_size: 2048
  intermediate_size: 12288
  first_k_dense_replace: 3
  routed_scaling_factor: 2.5

  # Multi-token prediction. One MTP layer (model.layers.78). The config has no
  # index_share_for_mtp_iteration key (GLM-5.2 introduced it), and layer 78 ships
  # a full bf16 indexer (wq_b [4096, 2048], wk [128, 6144], weights_proj
  # [32, 6144] in the 00274 header). Read as: the draft computes its own index.
  # See provenance.estimated.
  num_nextn_predict_layers: 1
  index_share_for_mtp_iteration: false

  # bf16 release: no quantization_config, dtype bfloat16, 0 scale tensors in
  # the weight map. KV bf16 — nothing in the checkpoint says otherwise.
  weight_dtype: bf16
  expert_dtype: bf16
  kv_dtype: bf16
  act_dtype: bf16

  # No op_dtype_overrides, deliberately — unlike glm-5.2. GLM-5's config has no
  # moe_router_dtype, so nothing declares an fp32 router; mlp.gate.weight is
  # BF16 [256, 6144] on disk. The router is priced at weight_dtype (bf16).

provenance:
  verified:
    - claim: no IndexShare — every layer carries indexer weights
      detail: >
        model.safetensors.index.json carries *.indexer.* tensors on all 78
        decoder layers and on MTP layer 78: 79 indexer-bearing layers. GLM-5.2's
        map has them on 22 (0,1,2,6,...,74 + MTP). The absence of index_topk_freq
        and indexer_types in config.json is therefore not missing data; the
        model genuinely recomputes the top-2048 selection on every layer.
    - claim: dense/sparse MLP split matches the tensor map
      detail: >
        experts.* on layers 3..78 (76 layers: 75 decoder + MTP), none on 0..2.
        Matches first_k_dense_replace 3.
    - claim: predicted weight bytes vs the published checkpoint
      detail: >
        total_size 1,507,728,316,928 B across 282 shards (59,870 tensors).
        model_weight_bytes predicts 1,507,574,808,576 B: -0.010%. The published
        total is 1,068,397,056 B larger than GLM-5.2's bf16 release, and that
        is EXACTLY 57 indexers: 57 x (wq_b 2048x4096 + wk 6144x128 +
        weights_proj 6144x32 + k_norm 2x128) x 2 B. Same widths, minus
        IndexShare, to the byte.
    - claim: GLM-5.1 is shape-identical
      detail: >
        zai-org/GLM-5.1's model.safetensors.index.json is byte-identical to this
        one (same total_size, same tensor-to-shard map) and its config differs
        only in transformers_version; the shard LFS hashes all differ (new
        weights). The glm-5.1 entry extends this one.

  estimated:
    - field: index_share_for_mtp_iteration
      value: false
      detail: >
        The config predates the key. The MTP layer ships its own indexer, so the
        draft is priced as computing its own index (one extra attn_index_proj +
        attn_index_score per drafted token) and its indexer weights count in the
        footprint, matching the map. If the engine reuses the main model's
        selection anyway, set true — cost drops by one indexer per draft.
    - field: moe_router precision
      value: bf16 (weight_dtype)
      detail: >
        No moe_router_dtype in config.json, unlike GLM-5.2's float32. An engine
        that upcasts the gate regardless (vLLM's DeepSeek path can) runs it fp32;
        either way it is a 256 x 6144 GEMM, negligible at decode.
    - field: MLA absorption (attn_kv_b vs attn_out_proj width)
      value: unabsorbed — kv_b runs as its own GEMM, o_proj narrow
      detail: >
        Same reading as glm-5.2. Same resident weights either way; an absorbing
        engine moves attn_out_proj by 2x.

  unmodelled:
    - rope_theta 1e6 and max_position_embeddings 202,752 (GLM-5.2 is 8e6 and
      1,048,576). Neither is a spec field; plan contexts above ~200K are
      outside what this checkpoint supports, and nothing stops the planner
      pricing them.
    - MTP eh_proj weight bytes (151 MB bf16, [6144, 12288]). The family prices
      eh_proj in the graph but not in model_weight_bytes.
    - Absorbed-MLA decode. See the estimated entry above.
    - Acceptance rate under MTP. The vendor recipe drafts 3 tokens; the
      fraction kept is a serving observable.
