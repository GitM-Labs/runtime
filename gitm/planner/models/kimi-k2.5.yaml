# moonshotai/Kimi-K2.5 — KimiK25ForConditionalGeneration; text_config is
# DeepseekV3ForCausalLM (model_type kimi_k2): classic dense MLA + sparse MoE.
# Source: https://huggingface.co/moonshotai/Kimi-K2.5/blob/4d01dfe0332d63057c186e0b262165819efb6611/config.json
# Read from config.json and model.safetensors.index.json only — no traces.
# Engine and deployment facts live in `deployment:`, apart from the checkpoint.
#
# Family note: `glm_moe_dsa` is the graph that models MLA + MoE; the DSA
# indexer is the one piece Kimi does not have, and it is switched off exactly,
# not approximately: every layer is 'shared' (zero indexer nodes, weights and
# cache keys — the weight map carries no indexer tensors to model), and
# index_topk equals max_position_embeddings (262144), so min(kv_len, topk)
# never binds and both core_qk_pairs and the capped prefill prefix-sum reduce
# to the dense causal count. What remains is precisely DeepSeek-V3-style dense
# MLA attention over the full history.

name: moonshotai/Kimi-K2.5
family: glm_moe_dsa
checkpoint:
  repository: moonshotai/Kimi-K2.5
  revision: 4d01dfe0332d63057c186e0b262165819efb6611
