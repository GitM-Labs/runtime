  tensor_count: 208550
  shard_count: 64
  index_total_size: 595148192736
# How this checkpoint is served here. Engine facts, kept apart from the
# checkpoint facts above; `spec` must agree with them (tests check it).
# Cited files are at the repo commit given after the @.
deployment:
  status: verified
  manifest: deploy/k8s/mi355x-kimi-loop.yaml@d9d8e6c02000dd08dd5f5d690baadd786031153f
  run_record: docs/autoresearch_noise_floor_mi355x.md@41c8fab783c20bb5c2a49cc69beaaa9667124d78
  served_revision: 4d01dfe0332d63057c186e0b262165819efb6611
  gpu: MI355X
  gpus: 8
  engine: vllm
  engine_version: 0.29.0
  image: vllm/vllm-openai-rocm@sha256:e5e47f6aaab675c252c381f0dac237b31b10d87bb74d092b07fb4065efd7f5a1
  tp: 8
