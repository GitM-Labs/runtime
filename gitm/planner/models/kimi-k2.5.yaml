  unverified: []
description: >
  61 layers, hidden 7168, ~1T total / ~32B active per token. Dense MLA
  attention (kv_lora_rank 512, one latent shared across 64 query heads, no
  sparse-attention indexer). First layer dense FFN, remaining 60 MoE (384
  experts, sigmoid top-8, one shared). Routed experts int4 (compressed-tensors
  W4A16, group 32); everything else bf16. No MTP weights in this checkpoint.
  Vision tower out of scope for a text decode step.

spec:
  hidden: 7168
  n_layers: 61
  vocab: 163840

  # MLA attention, the unmodified DeepSeek-V3 shape. num_key_value_heads is 64
  # in the config but is the usual MLA red herring: the cache holds one
  # kv_lora_rank latent (plus the shared 64-wide RoPE key) per token, shared
  # across all 64 query heads.
  n_heads: 64
  q_lora_rank: 1536
  kv_lora_rank: 512
  qk_nope_head_dim: 128
  qk_rope_head_dim: 64
  v_head_dim: 128

  # No DeepSeek Sparse Attention. index_topk = max_position_embeddings so the
  # core's min(kv_len, index_topk) bound never binds — attention is dense in
  # context, quadratic at prefill, which is this model's actual cost. All 61
  # layers 'shared' means no layer computes an index: no indexer node is
  # emitted, no indexer weights are counted, no index keys are cached. The
  # weight map agrees — zero indexer tensors anywhere.
  index_n_heads: 0
  index_head_dim: 0
  index_topk: 262144
  indexer_types:
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
    - shared
