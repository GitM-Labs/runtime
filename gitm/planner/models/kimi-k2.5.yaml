      detail: >
        Re-read 2026-10-19 at 4d01dfe0 (config.json sha256 acd5bb01, matching the
        inventory). Every spec shape field agrees: hidden 7168, 61 layers, 64
        heads, q/kv lora 1536/512, qk_nope/rope/v 128/64/128, 384 routed experts,
        top-8, 1 shared, moe_intermediate 2048, intermediate 18432,
        first_k_dense_replace 1, routed_scaling_factor 2.827, vocab 163840,
        num_nextn_predict_layers 0. The config has no index_topk; 262144 is
        max_position_embeddings, as above.
    - claim: precision recipe matches text_config.quantization_config
      detail: >
        At 4d01dfe0: compressed-tensors pack-quantized int4, symmetric, group 32,
        weights only (input_activations null), kv_cache_scheme null. ignore is
        self_attn, shared_experts, mlp.(gate|up|gate_up|down)_proj (layer 0's
        dense FFN), lm_head, vision_tower, mm_projector, so only routed experts
        are int4. That is expert_dtype int4, kv_dtype bf16, moe_shared bf16.
    - claim: no sparse-attention indexer and no MTP head, read from the weight map
      detail: >
        Re-read 2026-10-19 at 4d01dfe0 (index sha256 bdba19b1).
        model.safetensors.index.json (208,550 tensors) contains zero indexer
        tensors and zero nextn/mtp/eh_proj tensors. Layers run 0..60 with
        exactly the seven DeepSeek-V3 MLA attention tensors each
        (q_a/q_b/kv_a_with_mqa/kv_b/o_proj plus the two norms).
    - claim: dense/sparse MLP split matches the tensor map
      detail: >
        Layer 0 carries no expert tensors (dense FFN); layers 1-60 carry
        experts.*.{gate,up,down}_proj.weight_packed/_scale/_shape and
        shared_experts.*. Matches first_k_dense_replace 1.
    - claim: predicted weight bytes match the published checkpoint
      detail: >
        At 4d01dfe0, model.safetensors.index.json total_size is 595,148,192,736 B
        (595.15 GB) over 64 shards. model_weight_bytes with int4 experts
        (0.5 + 2/32 B/weight) predicts 594.20 GB, -0.16%; the residual is the
        unmodelled vision tower (~0.9 GB). The same shape all-bf16 would be
        2.053 TB, so the int4 entry is doing real work here, not rounding.
    - claim: the MI355X deployment serves this revision on vLLM 0.29.0, TP8, no EP
      detail: >
        docs/autoresearch_noise_floor_mi355x.md:60-63 @41c8fab7, a measured run
        on 2026-10-12, records HF snapshot 4d01dfe0 (this entry's pin), vLLM
        0.29.0 on ROCm 7.2.3, image digest e5e47f6a, launched from
        deploy/k8s/mi355x-kimi-loop.yaml. That manifest @d9d8e6c0 (lines
        155-165) runs `vllm serve moonshotai/Kimi-K2.5 --tensor-parallel-size 8
        --gpu-memory-utilization 0.92 --max-num-batched-tokens 8192
        --max-num-seqs 256` with no --enable-expert-parallel, no
        --kv-cache-dtype and no speculative config. The baseline record
        docs/search_space_kimi_mi355x.md:14,23 @0a2bd67d agrees: TP=8, expert
        parallel off, bf16 KV (auto).
    - claim: KV cache is bf16 as served, matching spec kv_dtype
      detail: >
        No --kv-cache-dtype means vLLM's auto, which follows the checkpoint.
        text_config.quantization_config.kv_cache_scheme is null at 4d01dfe0, so
        auto resolves to the model dtype, bf16. The fp8 KV in
        deploy/k8s/parallel/kimi-intervene.yaml:116 is an intervention arm
        against this baseline (docs/kimi_mi355x_loop_runbook.md:19), not the
        deployment.
    - claim: deploy/k8s/mi355x-kimi.yaml (SGLang + NEXTN) is not the deployment
      detail: >
        mi355x-kimi-loop.yaml:14-17 @d9d8e6c0 records that it replaced the SGLang
        unit because this checkpoint has no MTP head, so the NEXTN flags
        (mi355x-kimi.yaml:116-123 @383f3c3f) drafted with nothing. The SGLang
        file still carries SGLANG_IMAGE and REGISTRY placeholders, so it cannot
        be applied as written; it was the tracer-validation unit. Speculative
        decoding is off in the real deployment.

  estimated:
    - field: MLA absorption (attn_kv_b vs attn_out_proj width)
      value: unabsorbed — kv_b runs as its own GEMM, o_proj narrow
      detail: >
        Same reading as the glm-5.2 entry: the graph models MLA unabsorbed. A
        serving engine that absorbs MLA (the common vLLM/SGLang decode path)
        folds W^UK into the query and W^UV into the output, dropping attn_kv_b
        and widening attn_out_proj's input to n_heads*kv_lora_rank
        (32768 -> 7168). Same resident weights either way; the two readings
        move attn_out_proj 2x — settle against the first MI355X capture.
    - field: moe_router precision
      value: bf16 (follows weight_dtype; no override)
      detail: >
        Unlike GLM-5.2 the config declares no moe_router_dtype, and the index
        file does not carry dtypes, so the router (mlp.gate.weight +
        e_score_correction_bias, sigmoid noaux_tc scoring) is left at
        weight_dtype rather than asserted fp32. Engines typically score in
        fp32 at run time; the node is ~2.75M weights per layer, so the choice
        moves nothing the monitor can resolve — recorded here so a trace can
        settle it.

  unmodelled:
    - The served revision is recorded by a run, not pinned by the manifest.
      mi355x-kimi-loop.yaml passes no --revision, so a node whose HF cache
      pulled a newer main would serve something else. main has not moved from
      4d01dfe0 (inventory, verified 2026-10-11).
    - The vision tower (27 ViT layers, hidden 1152, ~0.9 GB) and mm projector.
      This entry prices the text decode step; vision tensors sit resident but
      idle. Their weight bytes are the dominant term in the total_size residual.
    - Activation dtype of expert GEMMs. W4A16 means int4 weights are
      dequantised into bf16 MACs — the graph prices weight *traffic* at int4
      and flops at the act dtype's peak, which is the right roofline for
      Marlin-style kernels.
