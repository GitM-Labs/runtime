# deepseek-ai/DeepSeek-R1-0528 — DeepseekV3ForCausalLM (model_type deepseek_v3):
# classic dense MLA + sparse MoE, FP8 block-128, one MTP layer.
# Source: https://huggingface.co/deepseek-ai/DeepSeek-R1-0528/blob/4236a6af538feda4548eca9ab308586007567f52/config.json
# Read from config.json, model.safetensors.index.json and the safetensors
# headers of all 163 shards at that revision — no traces, no engine run.
#
# Family note: modelled in `glm_moe_dsa` with the DSA indexer switched off
# exactly, the kimi-k2.5 pattern: every layer 'shared' (zero indexer nodes,
# weights and cache keys — the weight map carries no indexer tensors) and
# index_topk = max_position_embeddings (163840), so min(kv_len, topk) never
# binds and attention is dense MLA over the full history. The rest of the
# entry follows deepseek-v3.2.yaml, which is this architecture plus the
# indexer: same hidden, heads, MLA ranks, experts, dense prefix, MTP layout
# and FP8 recipe.
#
# Published-size trap: the index's metadata.total_size (1,369,062,772,000)
# is exactly 2 x the 684,531,386,000 tensor elements — a bf16-equivalent
# count, not the stored size (same artefact as DeepSeek-V3.2). The stored
# payload, from the headers, is 688,574,839,360 B; HF's file listing gives
# 688,586,727,753 B on disk, the difference being the 163 headers.

name: deepseek-ai/DeepSeek-R1-0528
family: glm_moe_dsa
checkpoint:
  repository: deepseek-ai/DeepSeek-R1-0528
  revision: 4236a6af538feda4548eca9ab308586007567f52
  config_sha256: 79ddea672a62e95d3f0be27be434375538e1988975971cffcf87c96c1de84a65
  index_sha256: a2c5d238ab1e8301a117336e9797e0d3551cb8f6dc9dc787318b23d8f54c9248
  tensor_count: 91991
  shard_count: 163
  index_total_size: 1369062772000   # 2 x element count, NOT stored bytes
  payload_bytes: 688574839360       # sum of header data_offsets
description: >
  61 layers, hidden 7168, ~671B total / ~37B active per token (684.5B elements
  including the MTP layer and scales). Dense MLA attention (kv_lora_rank 512,
  one latent plus a 64-wide RoPE key shared across 128 query heads, no
  sparse-attention indexer). First 3 layers dense FFN (18432), remaining 58 MoE
  (256 experts, sigmoid noaux_tc top-8 in 8 groups / top-4 groups, one shared).
  One MTP layer with its own embedding, head and eh_proj. FP8 e4m3 with fp32
  128x128 block scales on every linear; embeddings, lm_head, router and the MTP
  embedding/head/eh_proj stored bf16. Native context 163,840 (YaRN x40 on 4096).

spec:
  hidden: 7168
  n_layers: 61
  vocab: 129280

  # MLA attention, the unmodified DeepSeek-V3 shape. Headers: q_a [1536, 7168],
  # q_b [24576, 1536] = 128 x (128 + 64), kv_a_proj_with_mqa [576, 7168] =
  # 512 latent + 64 RoPE, kv_b [32768, 512] = 128 x (128 + 128), o_proj
  # [7168, 16384] = 128 x 128. num_key_value_heads 128 in the config is the MLA
  # red herring: the cache holds one 576-wide entry per token per layer.
  n_heads: 128
  q_lora_rank: 1536
  kv_lora_rank: 512
  qk_nope_head_dim: 128
  qk_rope_head_dim: 64
  v_head_dim: 128

  # No DeepSeek Sparse Attention. index_topk = max_position_embeddings (163840)
  # so the core's min(kv_len, index_topk) never binds; all 61 layers 'shared'
  # so no layer emits an indexer node, weight or cached key. Verified: zero
  # indexer tensors in the weight map, on any layer including the MTP layer.
  index_n_heads: 0
  index_head_dim: 0
  index_topk: 163840
  indexer_types: [
    shared, shared, shared, shared, shared, shared, shared, shared, shared, shared,
    shared, shared, shared, shared, shared, shared, shared, shared, shared, shared,
    shared, shared, shared, shared, shared, shared, shared, shared, shared, shared,
    shared, shared, shared, shared, shared, shared, shared, shared, shared, shared,
    shared, shared, shared, shared, shared, shared, shared, shared, shared, shared,
    shared, shared, shared, shared, shared, shared, shared, shared, shared, shared,
    shared,
  ]

  # Mixture of experts. Layers 0-2 carry mlp.{gate,up,down}_proj [18432 x 7168]
  # and no experts; layers 3-60 and the MTP layer (61) carry 256 experts
  # (15,104 = 59 x 256 expert triples) plus one shared expert and a router.
  # n_group 8 / topk_group 4 / sigmoid scoring are numerics only — no term in
  # the FLOP/byte roofline.
  n_routed_experts: 256
  n_shared_experts: 1
  num_experts_per_tok: 8
  moe_intermediate_size: 2048
  intermediate_size: 18432
  first_k_dense_replace: 3
  routed_scaling_factor: 2.5

  # One MTP layer (model.layers.61): full MLA attention + MoE, plus its own
  # embed_tokens [129280, 7168], shared_head.head [129280, 7168] and eh_proj
  # [7168, 14336], all bf16 — hence mtp_separate_embedding_head. It carries no
  # indexer, so index_share_for_mtp_iteration stays true (no MTP indexer node).
  num_nextn_predict_layers: 1
  index_share_for_mtp_iteration: true
  mtp_separate_embedding_head: true

  # FP8 e4m3, 128x128 block scales stored as F32 weight_scale_inv (no
  # scale_fmt key in this config, unlike V3.2's ue8m0) — exactly the planner's
  # fp8 rate (1 + 4/16384 B/weight). Experts are fp8 too: no fp4/int4 here.
  weight_dtype: fp8
  expert_dtype: fp8
  # Cache layout is a serving choice; bf16 matches torch_dtype and the
  # deepseek-v3.2 entry. An fp8 MLA cache roughly halves kv_bytes_per_token.
  kv_dtype: bf16
  act_dtype: bf16

  # Read from the headers (BF16, no weight_scale_inv sibling): embed_tokens,
  # lm_head, mlp.gate.weight (router), and the MTP layer's embed_tokens,
  # shared_head.head and eh_proj. Router execution fp32 follows the v3.2
  # entry's hypothesis; its storage is bf16.
  op_dtype_overrides:
    - [embed_tokens, bf16]
    - [lm_head, bf16]
    - [mtp_embed_tokens, bf16]
    - [mtp_lm_head, bf16]
    - [mtp_eh_proj, bf16]
    - [moe_router, fp32]
  stored_dtype_overrides:
    - [moe_router, bf16]

provenance:
  verified:
    - claim: every spec value is read from config.json at the pinned revision
      detail: >
        hidden_size 7168, num_hidden_layers 61, vocab_size 129280,
        num_attention_heads 128, q_lora_rank 1536, kv_lora_rank 512,
        qk_nope_head_dim 128, qk_rope_head_dim 64, v_head_dim 128,
        n_routed_experts 256, n_shared_experts 1, num_experts_per_tok 8,
        moe_intermediate_size 2048, intermediate_size 18432,
        first_k_dense_replace 3, routed_scaling_factor 2.5,
        num_nextn_predict_layers 1, max_position_embeddings 163840 (used as
        index_topk), quantization_config fp8 e4m3 [128,128]. No index_* keys.
    - claim: no indexer, dense prefix 0-2, one MTP layer — from the weight map
      detail: >
        91,991 tensors over layers 0-61. Zero self_attn.indexer.* tensors.
        Layers 0-2 hold mlp.gate_proj (dense) and no experts; 3-61 hold
        experts. Layer 61 additionally holds embed_tokens, shared_head.head,
        shared_head.norm, eh_proj, enorm and hnorm.
    - claim: shapes and dtypes read from every shard header; ledger closes exactly
      detail: >
        All 163 headers sum to 688,574,839,360 B. Classes: routed experts
        665.18 GB (F8_E4M3) + 0.16 GB F32 scales, o_proj 7.28, four 129280 x
        7168 bf16 tables (embed, lm_head, MTP embed, MTP head) 7.41, q_b 2.34,
        shared experts 2.60, dense FFN 1.19, kv_b 1.04, q_a 0.68, kv_a 0.26,
        router 0.22 (BF16), eh_proj 0.21 (BF16).
    - claim: model_weight_bytes vs published size
      detail: >
        688,572,683,040 B predicted against 688,574,839,360 B stored (-0.0003%,
        -2.16 MB: norms, correction biases and scale-tile rounding). Against
        the index's total_size it is -49.7%, because that field is 2 x the
        element count, not bytes (see the header comment) — compare against
        payload_bytes, never total_size, for this checkpoint.

  estimated:
    - field: kv_dtype
      value: bf16 (serving scenario; deployment UNVERIFIED)
      detail: >
        torch_dtype bf16 does not fix the cache layout; vLLM/SGLang commonly
        serve this family with an fp8 MLA cache (fp8_ds_mla). Pin per deployment.
    - field: MLA absorption (attn_kv_b vs attn_out_proj width)
      value: unabsorbed — kv_b runs as its own GEMM, o_proj narrow
      detail: >
        Same reading as kimi-k2.5 / deepseek-v3.2. An absorbed decode path
        widens attn_out_proj's input to n_heads*kv_lora_rank (65536) and drops
        attn_kv_b; same resident bytes, different per-op traffic.
    - field: moe_router execution precision
      value: fp32 hypothesis (stored bf16)
      detail: >
        As in deepseek-v3.2. ~1.8M weights per layer; moves nothing a monitor
        can resolve.

  unmodelled:
    - Grouped top-k routing (n_group 8, topk_group 4). Restricts which experts
      a token can pick, which can lower the distinct-experts union at a given
      batch versus free top-8 of 256; the planner assumes free top-k.
    - MTP acceptance rate. The graph prices the draft layer every step; the
      fraction of drafts kept is a serving observable.
    - Expert-capacity padding in grouped-GEMM backends (would read all 256
      experts per step at low batch).
    - Norms, e_score_correction_bias and partial scale tiles (2.16 MB).
